spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fraudshield}
    username: ${DATABASE_USER:fraudshield}
    password: ${DATABASE_PASSWORD}
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  demo-password: ${DEMO_PASSWORD}
  worker-enabled: ${WORKER_ENABLED:true}
