spring:
  task:
    scheduling:
      pool:
        size: 2
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fraudshield}
    username: ${DATABASE_USER:fraudshield}
    password: ${DATABASE_PASSWORD}
  jackson:
    serialization:
      write-dates-as-timestamps: false
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
  # store-type=none rolls back to in-memory sessions (single-replica only) without a code change -
  # see docs/plans/04-scalability.md's rollback note.
  session:
    store-type: ${SESSION_STORE:redis}
    redis:
      flush-mode: on-save
      namespace: raksha:session
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s
server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
  error:
    include-message: never
management:
  health:
    mail:
      enabled: false
    rabbit:
      enabled: false
    probes:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics,info
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: raksha
    distribution:
      percentiles-histogram:
        http.server.requests: true
app:
  mail-from: ${SMTP_FROM:}
  demo-password: ${DEMO_PASSWORD}
  worker-enabled: ${WORKER_ENABLED:true}
  worker-mode: ${WORKER_MODE:poll}
logging:
  structured:
    format:
      console: ecs
  level:
    com.fraudshield: INFO
