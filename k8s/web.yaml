apiVersion: v1
kind: Service
metadata:
  name: raksha-web
  labels:
    app.kubernetes.io/part-of: raksha
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: raksha-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: raksha-web
  labels:
    app.kubernetes.io/name: raksha-web
    app.kubernetes.io/part-of: raksha
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: raksha-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: raksha-web
        app.kubernetes.io/part-of: raksha
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: adarshbiradar/raksha-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
