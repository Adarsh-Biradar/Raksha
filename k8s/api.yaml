apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/part-of: raksha
spec:
  selector:
    app.kubernetes.io/name: raksha-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: raksha-api
  labels:
    app.kubernetes.io/name: raksha-api
    app.kubernetes.io/part-of: raksha
spec:
  # The MVP uses in-memory sessions and a worker in the API process.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: raksha-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: raksha-api
        app.kubernetes.io/part-of: raksha
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: adarshbiradar/raksha-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: raksha-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: { name: raksha-secrets, key: DATABASE_PASSWORD }
            - name: DEMO_PASSWORD
              valueFrom:
                secretKeyRef: { name: raksha-secrets, key: DEMO_PASSWORD }
            - name: SERVER_SHUTDOWN
              value: graceful
            - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
              value: 25s
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=65.0"
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet: { path: /actuator/health, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /actuator/health, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # Port check intentionally avoids restarting the JVM on a DB outage.
          # This is a basic process check, not detection of every application hang.
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 256Mi
